<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0082ff" />
    <meta name="referrer" content="no-referrer" />

    <!-- Primary meta -->
    <title>SilverChat — Privacy-first messaging</title>
    <meta
      name="description"
      content="Privacy-first messaging for the conversations that matter. Real-time chats, stories, communities, channels, and voice &amp; video calls in a silver and electric-blue design."
    />
    <link rel="canonical" href="https://silverchat-app.netlify.app/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SilverChat" />
    <meta property="og:title" content="SilverChat — Privacy-first messaging" />
    <meta
      property="og:description"
      content="Privacy-first messaging for the conversations that matter. Real-time chats, stories, communities, channels, and voice &amp; video calls in a silver and electric-blue design."
    />
    <meta property="og:url" content="https://silverchat-app.netlify.app/" />
    <meta property="og:image" content="https://silverchat-app.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="The SilverChat logo: a silver S on an electric-blue circle, next to the SilverChat wordmark."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SilverChat — Privacy-first messaging" />
    <meta
      name="twitter:description"
      content="Privacy-first messaging for the conversations that matter. Real-time chats, stories, communities, channels, and voice &amp; video calls in a silver and electric-blue design."
    />
    <meta name="twitter:image" content="https://silverchat-app.netlify.app/og-image.png" />
    <meta name="twitter:image:alt" content="The SilverChat logo and wordmark on a silver and electric-blue background." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SilverChat" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SilverChat",
        "url": "https://silverchat-app.netlify.app/",
        "description": "Privacy-first messaging for the conversations that matter.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "inLanguage": ["en", "es"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
