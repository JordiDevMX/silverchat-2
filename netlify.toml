[build]
  command = "pnpm build"
  publish = "dist"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[dev]
  command = "pnpm dev --host 0.0.0.0"
  targetPort = 5173
  port = 8888
  framework = "vite"
[[redirects]]
  from = "/api/auth/logout-all"
  to = "/.netlify/functions/auth-logout"
  status = 200
  force = true
[[redirects]]
  from = "/api/auth/:operation"
  to = "/.netlify/functions/auth-:operation"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/auth/*"
  [headers.values]
    Cache-Control = "no-store"
